<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deadpool Widget</title>
  <style>
    :root {
      --bg: rgba(8, 11, 20, 0.92);
      --panel: rgba(18, 23, 35, 0.96);
      --line: rgba(255, 255, 255, 0.12);
      --text: #f5f7ff;
      --muted: #9da9c5;
      --red-1: #9b2c2c;
      --red-2: #ef4444;
      --accent: #7c93ff;
      --ok: #4ade80;
      --warn: #fbbf24;
      --danger: #fb7185;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      color: var(--text);
      font-family: "Manrope", system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    .stage {
      width: 100%;
      height: 100%;
      display: grid;
      align-items: end;
      justify-items: end;
      padding: 12px;
      -webkit-app-region: drag;
    }

    .widget {
      width: 446px;
      display: grid;
      gap: 10px;
      justify-items: end;
      position: relative;
    }

    .chat {
      position: absolute;
      right: 166px;
      bottom: 202px;
      width: 286px;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: linear-gradient(135deg, rgba(19, 24, 38, 0.96), rgba(11, 15, 25, 0.96));
      backdrop-filter: blur(12px);
      border-radius: 18px 18px 8px 18px;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.34);
      opacity: 0;
      transform: translateY(10px) scale(0.96);
      pointer-events: none;
      transition: all 220ms ease;
      -webkit-app-region: no-drag;
      z-index: 4;
    }

    .chat::after {
      content: "";
      position: absolute;
      right: 22px;
      bottom: -9px;
      width: 18px;
      height: 18px;
      background: inherit;
      border-right: 1px solid rgba(255, 255, 255, 0.14);
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      transform: rotate(45deg);
    }

    .widget.open .chat {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px 8px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.02));
      border-radius: 14px 14px 0 0;
    }

    .chat-title {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 10px rgba(124, 147, 255, 0.75);
      flex-shrink: 0;
    }

    .chat-title strong {
      display: block;
      font-size: 0.92rem;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-title small {
      color: var(--muted);
      font-size: 0.74rem;
      display: block;
      margin-top: 2px;
    }

    .icon-btn {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      width: 28px;
      height: 28px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 700;
      display: grid;
      place-items: center;
    }

    .messages {
      max-height: 220px;
      overflow-y: auto;
      padding: 8px 2px 2px;
      display: grid;
      gap: 8px;
      align-content: start;
    }

    .msg {
      max-width: 90%;
      padding: 9px 11px;
      border-radius: 14px;
      font-size: 0.84rem;
      line-height: 1.45;
      white-space: pre-wrap;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.18);
      animation: rise 180ms ease;
    }

    .msg.user {
      justify-self: end;
      background: linear-gradient(135deg, rgba(124, 147, 255, 0.22), rgba(239, 68, 68, 0.18));
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .msg.assistant {
      justify-self: start;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.10);
    }

    .msg.system {
      justify-self: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      color: var(--muted);
      max-width: 96%;
      font-size: 0.79rem;
      text-align: center;
    }

    .composer {
      padding: 8px 0 0;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: grid;
      gap: 8px;
      background: transparent;
    }

    .mode-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 0.74rem;
    }

    .mode-select {
      min-width: 148px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.07);
      color: var(--text);
      padding: 6px 8px;
      font: inherit;
      outline: none;
    }

    .speech-bubble {
      position: relative;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 8px;
      padding: 7px;
      border-radius: 12px 12px 12px 4px;
      background: linear-gradient(135deg, rgba(124, 147, 255, 0.15), rgba(255, 255, 255, 0.08));
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
      color: var(--text);
    }

    .speech-bubble::after {
      content: "";
      position: absolute;
      left: 18px;
      bottom: -8px;
      width: 14px;
      height: 14px;
      background: inherit;
      border-right: 1px solid rgba(255,255,255,0.16);
      border-bottom: 1px solid rgba(255,255,255,0.16);
      transform: rotate(45deg);
    }

    .message-input {
      flex: 1;
      min-width: 0;
      min-height: 58px;
      max-height: 120px;
      resize: vertical;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 0.82rem;
      line-height: 1.35;
      user-select: text;
      -webkit-user-select: text;
    }

    .message-input::placeholder {
      color: var(--muted);
    }

    .send {
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      padding: 7px 10px;
      color: #fff;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--red-2));
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(124, 147, 255, 0.16);
      font-size: 0.78rem;
    }

    .send:disabled,
    .message-input:disabled,
    .mode-select:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .status {
      min-height: 18px;
      color: var(--muted);
      font-size: 0.75rem;
      padding-left: 2px;
    }

    .status.warn {
      color: var(--warn);
    }

    .status.ok {
      color: var(--ok);
    }

    .status.bad {
      color: var(--danger);
    }

    .avatar-wrap {
      position: absolute;
      right: 2px;
      bottom: 0;
      width: 162px;
      height: 192px;
      -webkit-app-region: no-drag;
      cursor: pointer;
      justify-self: end;
      margin-right: 0;
      z-index: 3;
      background: transparent;
      border: none;
      padding: 0;
      appearance: none;
      -webkit-appearance: none;
      transition: transform 200ms ease, filter 200ms ease;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,0.18));
    }

    .avatar-wrap:focus,
    .avatar-wrap:focus-visible {
      outline: none;
      box-shadow: none;
    }

    .avatar-wrap.active {
      transform: translateY(-3px) scale(1.01);
    }

    .avatar-bubble {
      position: absolute;
      right: 136px;
      bottom: 104px;
      min-width: 126px;
      max-width: 160px;
      padding: 8px 10px;
      border-radius: 12px 12px 4px 12px;
      background: rgba(255,255,255,0.95);
      color: #111827;
      font-size: 0.74rem;
      line-height: 1.3;
      box-shadow: 0 10px 18px rgba(0,0,0,0.2);
      opacity: 0;
      transform: translateY(6px) scale(0.96);
      pointer-events: none;
      transition: all 220ms ease;
      z-index: 4;
    }

    .avatar-bubble.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .avatar-shadow {
      display: none;
    }

    .avatar {
      position: absolute;
      inset: 0;
      border-radius: 0;
      overflow: visible;
      border: none;
      box-shadow: none;
      background: transparent;
      animation: none;
      transform-origin: center bottom;
      transform: none;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform: scale(1);
      filter: none;
      pointer-events: none;
      display: block;
      background: transparent;
      animation: avatarIdle 2.2s ease-in-out infinite;
    }

    .avatar-wrap.state-chatting .avatar img {
      animation: avatarChat 0.8s ease-in-out infinite alternate;
    }

    .avatar-wrap.state-running .avatar img {
      animation: avatarRun 0.45s ease-in-out infinite;
    }

    .avatar-wrap.state-review .avatar img {
      animation: avatarReview 1.25s ease-in-out infinite;
    }

    .avatar-wrap.state-waiting .avatar img {
      animation: avatarChat 1.1s ease-in-out infinite alternate;
    }

    .avatar-wrap.state-failed .avatar img {
      animation: avatarReview 0.55s ease-in-out 2;
    }

    .avatar-wrap.active .avatar {
      animation: none;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes toonMove {
      0% { transform: translateY(0) rotate(0deg) scale(1, 1); }
      10% { transform: translateY(-2px) rotate(-2deg) scale(1.03, 0.97); }
      22% { transform: translateY(-7px) rotate(2deg) scale(0.98, 1.04); }
      32% { transform: translateY(1px) rotate(-1.4deg) scale(1.04, 0.95); }
      45% { transform: translateY(-4px) rotate(1deg) scale(0.99, 1.02); }
      58% { transform: translateY(-9px) rotate(-2deg) scale(0.97, 1.06); }
      70% { transform: translateY(1px) rotate(1.2deg) scale(1.03, 0.96); }
      84% { transform: translateY(-3px) rotate(-0.8deg) scale(1.01, 1.01); }
      100% { transform: translateY(0) rotate(0deg) scale(1, 1); }
    }

    @keyframes toonBurst {
      0% { transform: translateY(0) scale(1); }
      28% { transform: translateY(-11px) rotate(-4deg) scale(0.95, 1.1); }
      56% { transform: translateY(2px) rotate(4deg) scale(1.08, 0.92); }
      100% { transform: translateY(0) scale(1); }
    }

    @keyframes avatarIdle {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(-1.5deg); }
    }

    @keyframes avatarChat {
      0%, 100% { transform: translateY(0px) rotate(-1deg); }
      50% { transform: translateY(-3px) rotate(1.5deg); }
    }

    @keyframes avatarRun {
      0%, 100% { transform: translateX(0px) rotate(-4deg); }
      50% { transform: translateX(4px) rotate(3deg); }
    }

    @keyframes avatarReview {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-2px) scale(1.01); }
    }

    @keyframes shadowPulse {
      0%, 100% { transform: translateX(-50%) scaleX(1); opacity: 0.5; }
      50% { transform: translateX(-50%) scaleX(0.84); opacity: 0.33; }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="widget" id="widget">
      <section class="chat" id="chatPanel" aria-label="Dialogo com Deadpool">
        <header class="chat-header">
          <div class="chat-title">
            <span class="dot" aria-hidden="true"></span>
            <div>
              <strong>Deadpool</strong>
              <small id="providerStatus">Verificando modelos...</small>
            </div>
          </div>
          <button id="closeAppBtn" class="icon-btn" type="button" aria-label="Fechar">x</button>
        </header>

        <div id="messages" class="messages" aria-live="polite">
          <div class="msg assistant">Criador, estou presente. Manda a missao.</div>
        </div>

        <form id="chatForm" class="composer">
          <label class="mode-row" for="modelMode">
            <span>Modo de resposta</span>
            <select id="modelMode" class="mode-select">
              <option value="auto">Automatico</option>
              <option value="dual-review">Dupla revisao</option>
              <option value="openai">Somente OpenAI</option>
              <option value="claude">Somente Claude</option>
            </select>
          </label>
          <div class="speech-bubble" role="group" aria-label="Balão de diálogo">
            <textarea id="messageInput" class="message-input" maxlength="12000" placeholder="Manda a missao..." aria-label="Mensagem para o Deadpool" required></textarea>
            <button id="sendBtn" class="send" type="submit">Enviar</button>
          </div>
          <p id="status" class="status"></p>
        </form>
      </section>

      <button class="avatar-wrap state-idle" id="avatarToggle" type="button" aria-label="Abrir ou fechar dialogo">
        <span class="avatar-bubble show" id="avatarBubble">Pronto para agir.</span>
        <span class="avatar-shadow" aria-hidden="true"></span>
        <span class="avatar" id="avatarCore">
          <img src="./deadpool-avatar.png" alt="Deadpool avatar" draggable="false" />
        </span>
      </button>
    </section>
  </main>

  <script src="./deadpool-agent.js"></script>
  <script>
    const widget = document.getElementById("widget");
    const avatarToggle = document.getElementById("avatarToggle");
    const messagesEl = document.getElementById("messages");
    const statusEl = document.getElementById("status");
    const formEl = document.getElementById("chatForm");
    const messageInput = document.getElementById("messageInput");
    const modelMode = document.getElementById("modelMode");
    const sendBtn = document.getElementById("sendBtn");
    const closeAppBtn = document.getElementById("closeAppBtn");
    const avatarBubble = document.getElementById("avatarBubble");
    const providerStatus = document.getElementById("providerStatus");

    let history = [];
    let busy = false;

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function setStatus(text, tone = "") {
      statusEl.textContent = text;
      statusEl.className = `status ${tone}`.trim();
    }

    function setBusy(nextBusy) {
      busy = nextBusy;
      messageInput.disabled = nextBusy;
      modelMode.disabled = nextBusy;
      sendBtn.disabled = nextBusy;
    }

    function updateProviderStatus(status) {
      const openaiReady = Boolean(status?.providers?.openai?.configured);
      const claudeReady = Boolean(status?.providers?.claude?.configured);
      if (openaiReady && claudeReady) providerStatus.textContent = "OpenAI + Claude com chaves configuradas";
      else if (openaiReady) providerStatus.textContent = "OpenAI com chave; Claude sem chave";
      else if (claudeReady) providerStatus.textContent = "Claude com chave; OpenAI sem chave";
      else providerStatus.textContent = "Configure as chaves no arquivo .env";
    }

    function triggerAvatarPulse() {
      avatarToggle.classList.remove("active");
      window.requestAnimationFrame(() => avatarToggle.classList.add("active"));
      window.setTimeout(() => avatarToggle.classList.remove("active"), 620);
    }

    function setAvatarMood(state, text) {
      avatarToggle.classList.remove("state-idle", "state-chatting", "state-running", "state-review", "state-waiting", "state-failed");
      avatarToggle.classList.add(`state-${state}`);
      if (avatarBubble) {
        avatarBubble.textContent = text;
        avatarBubble.classList.add("show");
        window.clearTimeout(setAvatarMood._hideTimer);
        setAvatarMood._hideTimer = window.setTimeout(() => {
          avatarBubble.classList.remove("show");
        }, 1700);
      }
    }

    avatarToggle.addEventListener("click", () => {
      widget.classList.toggle("open");
      triggerAvatarPulse();
      setAvatarMood("chatting", widget.classList.contains("open") ? "Estou aqui, criador." : "Pronto para agir.");
      if (widget.classList.contains("open")) messageInput.focus();
    });

    closeAppBtn.addEventListener("click", () => {
      window.deadpoolDesktop?.closeApp();
    });

    formEl.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (busy) return;
      const userMessage = messageInput.value.trim();
      if (!userMessage) return;

      addMessage("user", userMessage);
      messageInput.value = "";
      setBusy(true);
      setStatus("Aguardando resposta...", "warn");
      triggerAvatarPulse();
      setAvatarMood("running", "Missao recebida.");

      try {
        const result = await window.DeadpoolAgent.runAgent(userMessage, history, {
          askConfirmation: async (text) => {
            setStatus("Sua confirmacao e necessaria.", "warn");
            setAvatarMood("waiting", "Preciso da sua decisao.");
            const approved = window.confirm(text);
            setStatus("Continuando...", "warn");
            setAvatarMood("running", "Decisao recebida.");
            return approved;
          },
          onToolEvent: (evt) => {
            if (evt.status === "waiting") setStatus("Aguardando sua confirmacao.", "warn");
            if (evt.status === "running") setStatus("Executando acao autorizada...", "warn");
            if (evt.status === "success") setStatus("Acao concluida.", "ok");
            if (evt.status === "error") setStatus("Uma acao falhou.", "bad");
            if (evt.status === "canceled") setStatus("Acao cancelada.", "warn");
          },
        }, { mode: modelMode.value });

        history = result.history || history;
        if (result.finalText) addMessage("assistant", result.finalText);
        if (!result.error) {
          const providerCopy = result.provider ? ` Resposta: ${result.provider}.` : "";
          setStatus(`Pronto para o proximo comando.${providerCopy}`, "ok");
          setAvatarMood("review", "Tarefa concluida.");
          if (result.warning) addMessage("system", `Aviso: ${result.warning}`);
        } else {
          addMessage("system", String(result.error));
          setStatus("Erro de execucao.", "bad");
          setAvatarMood("failed", "Precisamos ajustar.");
        }
      } catch (error) {
        addMessage("system", `Erro: ${String(error && error.message ? error.message : error)}`);
        setStatus("Erro de execucao.", "bad");
        setAvatarMood("failed", "Precisamos ajustar.");
      } finally {
        setBusy(false);
        messageInput.focus();
      }
    });

    messageInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        formEl.requestSubmit();
      }
    });

    window.DeadpoolAgent.getStatus()
      .then(updateProviderStatus)
      .catch(() => {
        providerStatus.textContent = "Backend indisponivel";
      });
  </script>
</body>
</html>
