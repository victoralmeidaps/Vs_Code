<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="refresh" content="5" />
    <title>Deadpool Pet Preview</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f1115;
        color: #f5f5f5;
        padding: 24px;
      }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { color: #b9c0cc; margin: 0 0 16px; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 20px;
      }
      .card {
        background: #171a22;
        border: 1px solid #2a3040;
        border-radius: 16px;
        padding: 14px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      }
      .card h2 { margin: 0 0 10px; font-size: 16px; }
      img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 12px;
        background: #0f1115;
      }
    </style>
  </head>
  <body>
    <h1>Preview ao vivo do pet</h1>
    <p>Esta página atualiza automaticamente para mostrar a versão mais recente.</p>
    <div class="grid">
      <div class="card">
        <h2>Versão atual</h2>
        <img id="currentPreview" src="decoded/preview.png" alt="Preview atual" />
      </div>
      <div class="card">
        <h2>Versão alternativa</h2>
        <img id="altPreview" src="decoded/preview-alt.png" alt="Preview alternativa" />
      </div>
    </div>
    <script>
      function refreshImages() {
        const t = Date.now();
        document.getElementById('currentPreview').src = 'decoded/preview.png?t=' + t;
        document.getElementById('altPreview').src = 'decoded/preview-alt.png?t=' + t;
      }
      setInterval(refreshImages, 5000);
      refreshImages();
    </script>
  </body>
</html>
