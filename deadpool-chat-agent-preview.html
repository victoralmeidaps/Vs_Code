<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deadpool Chat Agent Preview</title>
  <style>
    :root {
      --bg: #09090c;
      --panel: #14141a;
      --line: rgba(255, 255, 255, 0.12);
      --text: #f5f5f7;
      --muted: #b6b6c3;
      --red-1: #7a1010;
      --red-2: #e11d2e;
      --ok: #2ec27e;
      --warn: #f59e0b;
      --bad: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Manrope", system-ui, -apple-system, sans-serif;
      color: var(--text);
      min-height: 100dvh;
      background:
        radial-gradient(900px 500px at 5% -10%, rgba(225, 29, 46, 0.26), transparent 60%),
        radial-gradient(700px 500px at 100% 120%, rgba(122, 16, 16, 0.30), transparent 60%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .app {
      width: min(980px, 100%);
      min-height: min(920px, 100dvh - 32px);
      border: 1px solid var(--line);
      border-radius: 28px;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: linear-gradient(180deg, #17171e, #0f1015);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #20202a, #17171f);
    }

    .identity {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--ok);
      box-shadow: 0 0 10px rgba(46, 194, 126, 0.85);
    }

    .title {
      margin: 0;
      font-family: "Bebas Neue", Impact, sans-serif;
      letter-spacing: 0.06em;
      font-size: 1.6rem;
      line-height: 1;
    }

    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      border: 1px solid var(--line);
      background: #21212b;
      color: var(--text);
      border-radius: 999px;
      padding: 10px 14px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.86rem;
      transition: transform 0.18s ease, border-color 0.18s ease;
    }

    .btn:hover { transform: translateY(-1px); border-color: rgba(225, 29, 46, 0.6); }

    .btn.primary {
      background: linear-gradient(135deg, var(--red-1), var(--red-2));
      border-color: rgba(255, 255, 255, 0.2);
    }

    .messages {
      overflow-y: auto;
      padding: 16px;
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .msg {
      max-width: min(84%, 620px);
      padding: 12px 14px;
      border-radius: 18px;
      line-height: 1.5;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.24);
      animation: rise 220ms ease;
      white-space: pre-wrap;
    }

    .msg.user {
      justify-self: end;
      background: linear-gradient(140deg, #8a1717, #e11d2e);
      border: 1px solid rgba(255, 255, 255, 0.24);
    }

    .msg.assistant {
      justify-self: start;
      background: #20202a;
      border: 1px solid var(--line);
    }

    .msg.system {
      justify-self: center;
      background: #15151c;
      border: 1px dashed rgba(255, 255, 255, 0.25);
      color: var(--muted);
      font-size: 0.84rem;
      max-width: 94%;
    }

    .composer {
      border-top: 1px solid var(--line);
      padding: 12px;
      display: grid;
      gap: 10px;
      background: #111118;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    input[type="text"] {
      width: 100%;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #1e1e28;
      color: var(--text);
      padding: 12px 14px;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: rgba(225, 29, 46, 0.75);
      box-shadow: 0 0 0 3px rgba(225, 29, 46, 0.18);
    }

    .status {
      min-height: 20px;
      font-size: 0.84rem;
      color: var(--muted);
    }

    .status.ok { color: var(--ok); }
    .status.warn { color: var(--warn); }
    .status.bad { color: var(--bad); }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #20202a;
      color: var(--muted);
      padding: 6px 10px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 720px) {
      .app {
        min-height: 100dvh;
        border-radius: 16px;
      }

      .topbar {
        align-items: start;
        flex-direction: column;
      }

      .msg { max-width: 92%; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="identity">
        <span class="dot" aria-hidden="true"></span>
        <div>
          <h1 class="title">DEADPOOL AGENT PREVIEW</h1>
          <p class="sub">Modo demonstração com tool-calling e confirmação</p>
        </div>
      </div>
      <div class="actions">
        <a class="btn" href="./deadpool-chat.html">Voltar para versão original</a>
        <button id="clearNotesBtn" class="btn" type="button">Limpar notas locais</button>
      </div>
    </header>

    <section id="messages" class="messages" aria-live="polite" aria-label="Historico do chat">
      <div class="msg assistant">Deadpool: Manda a missão. Eu posso consultar clima e salvar nota com confirmação.</div>
      <div class="msg system">Dica: teste com "clima em Lisboa" ou "anota: revisar landing page".</div>
    </section>

    <form id="chatForm" class="composer">
      <div class="chips">
        <button class="chip" type="button" data-template="clima em Sao Paulo">clima em Sao Paulo</button>
        <button class="chip" type="button" data-template="clima em Porto Alegre">clima em Porto Alegre</button>
        <button class="chip" type="button" data-template="anota: Ajustar copy do hero">anota: Ajustar copy do hero</button>
      </div>
      <div class="row">
        <input id="messageInput" type="text" placeholder="Digite aqui..." autocomplete="off" />
        <button id="sendBtn" class="btn primary" type="submit">Enviar</button>
      </div>
      <p id="statusLine" class="status"></p>
    </form>
  </div>

  <script src="./deadpool-agent.js"></script>
  <script>
    const messagesEl = document.getElementById("messages");
    const statusLineEl = document.getElementById("statusLine");
    const formEl = document.getElementById("chatForm");
    const inputEl = document.getElementById("messageInput");
    const clearNotesBtn = document.getElementById("clearNotesBtn");
    const chipButtons = Array.from(document.querySelectorAll(".chip"));

    let history = [];

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = `${role === "user" ? "Voce" : role === "assistant" ? "Deadpool" : "Sistema"}: ${text}`;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function setStatus(text, tone = "") {
      statusLineEl.textContent = text;
      statusLineEl.className = `status ${tone}`.trim();
    }

    async function askConfirmation(text) {
      return window.confirm(`${text}\n\nDeseja permitir esta acao?`);
    }

    async function onSubmit(event) {
      event.preventDefault();
      const userMessage = inputEl.value.trim();
      if (!userMessage) return;

      addMessage("user", userMessage);
      inputEl.value = "";
      setStatus("Deadpool esta pensando...", "warn");

      const result = await window.DeadpoolAgent.runAgent(userMessage, history, {
        askConfirmation,
        onToolEvent: (evt) => {
          if (evt.status === "running") {
            addMessage("system", `Executando ferramenta ${evt.tool}...`);
            setStatus(`Executando ${evt.tool}...`, "warn");
          }
          if (evt.status === "success") {
            addMessage("system", `Ferramenta ${evt.tool} executada com sucesso.`);
            setStatus(`${evt.tool} finalizada.`, "ok");
          }
          if (evt.status === "error") {
            addMessage("system", evt.error || `Erro na ferramenta ${evt.tool}.`);
            setStatus(`Falha em ${evt.tool}.`, "bad");
          }
          if (evt.status === "canceled") {
            addMessage("system", `Acao em ${evt.tool} cancelada.`);
            setStatus(`Acao cancelada em ${evt.tool}.`, "warn");
          }
        },
      });

      history = result.history || history;

      if (result.error) {
        addMessage("system", result.error);
      }

      addMessage("assistant", result.finalText || "Sem resposta final do agente.");
      if (!result.error) setStatus("Pronto. Pode mandar a proxima.", "ok");
    }

    function clearNotes() {
      const keys = Object.keys(localStorage).filter((k) => k.startsWith("note-"));
      keys.forEach((k) => localStorage.removeItem(k));
      addMessage("system", `${keys.length} nota(s) local(is) removida(s).`);
      setStatus("Notas locais limpas.", "ok");
    }

    formEl.addEventListener("submit", onSubmit);
    clearNotesBtn.addEventListener("click", clearNotes);

    chipButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        inputEl.value = btn.dataset.template || "";
        inputEl.focus();
      });
    });
  </script>
</body>
</html>
